version: 2

models:
  - name: dim_patient
    columns:
      - name: patient_id
        data_tests:
          - not_null
          - unique

  - name: dim_provider
    columns:
      - name: provider_id
        data_tests:
          - not_null
          - unique

  - name: dim_insurance
    columns:
      - name: insurance_id
        data_tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fct_claim
    columns:
      - name: claim_id
        data_tests:
          - not_null
          - unique

      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

      - name: provider_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id

  - name: fct_billing
    columns:
      - name: billing_id
        data_tests:
          - not_null
          - unique

      - name: claim_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_claim')
                field: claim_id

  - name: fct_payment
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: claim_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_claim')
                field: claim_id

  - name: fct_appointment
    columns:
      - name: appointment_id
        data_tests:
          - not_null
          - unique

      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

      - name: provider_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id

  - name: fct_clinical_record
    columns:
      - name: clinical_id
        data_tests:
          - not_null
          - unique

      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

      - name: provider_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id
                
  - name: healthcare_kpis
    description: "Executive healthcare KPI summary for BI reporting."
    columns:
      - name: total_patients
        data_tests:
          - not_null

      - name: total_appointments
        data_tests:
          - not_null

      - name: total_claims
        data_tests:
          - not_null

      - name: total_billed
        data_tests:
          - not_null

      - name: total_paid
        data_tests:
          - not_null

      - name: total_balance
        data_tests:
          - not_null

      - name: denial_rate_pct
        data_tests:
          - not_null

      - name: no_show_rate_pct
        data_tests:
          - not_null

      - name: collection_rate_pct
        data_tests:
          - not_null