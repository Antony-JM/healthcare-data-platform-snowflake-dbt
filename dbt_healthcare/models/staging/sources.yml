version: 2

sources:
  - name: raw
    database: "{{ target.database }}"
    schema: RAW

    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 48
          period: hour

    tables:
      - name: patients
      - name: providers
      - name: insurance
      - name: appointments
      - name: clinical_records
      - name: claims
      - name: billing
      - name: payments
      - name: doctor_assignments
