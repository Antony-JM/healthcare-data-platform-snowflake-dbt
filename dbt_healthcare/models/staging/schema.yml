version: 2
models:
  - name: stg_patients
    columns:
      - name: patient_id
        tests: [not_null, unique]
  - name: stg_providers
    columns:
      - name: provider_id
        tests: [not_null, unique]
  - name: stg_claims
    columns:
      - name: claim_id
        tests: [not_null, unique]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id
      - name: billed_amount
        tests: [not_null]
  - name: stg_appointments
    columns:
      - name: appointment_id
        tests: [not_null, unique]
  - name: stg_insurance
    columns:
      - name: insurance_id
        tests: [not_null, unique]
